<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login - Barpeta Polytechnic Feedback System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .bg-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body class="bg-gradient">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg" style="width: 100%; max-width: 450px;">
            <div class="card-header bg-success text-white text-center py-4">
                <h4 class="mb-2"><i class="bi bi-mortarboard"></i> Faculty Login</h4>
                <small>Barpeta Polytechnic Feedback System</small>
            </div>
            <div class="card-body p-4">
                <div id="alertBox"></div>
                <form id="facultyLoginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label"><i class="bi bi-envelope"></i> Email *</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="Enter email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label"><i class="bi bi-lock"></i> Password *</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter password" required>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100"><i class="bi bi-box-arrow-in-right"></i> Login</button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="text-muted small mb-2"><strong>Demo Credentials:</strong></p>
                    <div class="alert alert-info alert-sm py-2">
                        <code>faculty@barpetapoly.edu</code> / <code>faculty123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('facultyLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (email === 'faculty@barpetapoly.edu' && password === 'faculty123') {
                if (remember) {
                    localStorage.setItem('facultyEmail', email);
                }
                sessionStorage.setItem('facultyLoggedIn', 'true');
                sessionStorage.setItem('facultyEmail', email);
                window.location.href = 'dashboard.html';
            } else {
                showAlert('Invalid credentials!', 'danger');
            }
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
        }
    </script>
</body>
</html>
