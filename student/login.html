<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Barpeta Polytechnic Feedback System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .bg-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body class="bg-gradient">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg" style="width: 100%; max-width: 450px;">
            <div class="card-header bg-info text-white text-center py-4">
                <h4 class="mb-2"><i class="bi bi-person-circle"></i> Student Login</h4>
                <small>Barpeta Polytechnic Feedback System</small>
            </div>
            <div class="card-body p-4">
                <div id="alertBox"></div>
                <form id="studentLoginForm">
                    <div class="mb-3">
                        <label for="enrollment" class="form-label"><i class="bi bi-card-text"></i> Enrollment Number *</label>
                        <input type="text" class="form-control form-control-lg" id="enrollment" name="enrollment" placeholder="Enter enrollment number" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label"><i class="bi bi-lock"></i> Password *</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter password" required>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="btn btn-info btn-lg w-100"><i class="bi bi-box-arrow-in-right"></i> Login</button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="text-muted small">For first time login, use your enrollment number as password</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('studentLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const enrollment = document.getElementById('enrollment').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (enrollment && password) {
                if (remember) {
                    localStorage.setItem('studentEnrollment', enrollment);
                }
                sessionStorage.setItem('studentLoggedIn', 'true');
                sessionStorage.setItem('studentEnrollment', enrollment);
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
